# Copie unique des images des études dans le dépôt (supprimée après usage).
name: Importer les images des études
on:
  push:
    branches: [main]
    paths: ['outils/images/source-images.txt']
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et ranger les images
        run: |
          url="$(head -n1 outils/images/source-images.txt)"
          curl -fsSL "$url" -o /tmp/images.zip
          mkdir -p assets/images
          unzip -o -q /tmp/images.zip -d assets/images
          echo "Images : $(ls assets/images/*.webp | wc -l)"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git commit -m "Images des études (243, générées avec fal.ai)" || echo "Rien de nouveau"
          git push
