# Tâche unique : importe les documents des études dans le site, en PDF (voir outils/documents/importer.py).
# Le résultat va dans la branche « documents-import », relue avant d’être versée dans main.
# Les PowerPoint d’origine vont dans la publication GitHub « powerpoint ».
name: Importer les documents
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/importer-documents.yml
      - outils/documents/importer.py
      - outils/documents/polices.conf
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: importer-documents
  cancel-in-progress: true
jobs:
  importer:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LibreOffice, Ghostscript et polices
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            libreoffice-core libreoffice-writer libreoffice-impress libreoffice-calc \
            ghostscript poppler-utils fonts-opensymbol fonts-dejavu fonts-liberation fonts-liberation2 \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-urw-base35 fonts-texgyre fonts-ebgaramond \
            fonts-adf-gillius fonts-roboto-slab fonts-noto-core fonts-noto-cjk fonts-wine
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q ttf-mscorefonts-installer \
            || echo "Polices Microsoft indisponibles : les équivalents Liberation sont utilisés."
          sudo mkdir -p /usr/local/share/fonts/tahoma
          sudo cp /usr/share/wine/fonts/tahoma*.ttf /usr/local/share/fonts/tahoma/
          sudo cp outils/documents/polices.conf /etc/fonts/local.conf
          sudo fc-cache -f > /dev/null
          for f in "Century Gothic" "Century Gothic:bold" "Gill Sans" "Garamond" "Monotype Corsiva" "Tahoma" \
                   "Arial" "Times New Roman" "Times" "Verdana" "Georgia" "Courier New" "Calibri" "Cambria" \
                   "Lucida Grande" "Geneva" "Symbol" "Wingdings"; do
            echo "$f -> $(fc-match "$f")"
          done
          soffice --version
          pip install --quiet pikepdf
      - name: Conversion en PDF
        env:
          TRAVAILLEURS: "4"
          ORIGINAUX: /tmp/originaux
        run: python3 outils/documents/importer.py
      - name: PowerPoint d’origine (publication « powerpoint »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view powerpoint > /dev/null 2>&1; then
            gh release create powerpoint --target main --latest=false \
              --title "Présentations PowerPoint d’origine" \
              --notes "Fichiers PowerPoint d’origine des présentations de https://mission.ka-ilei.com, pour projeter avec les animations. Sur le site, les mêmes présentations se lisent en PDF."
          fi
          gh release upload powerpoint /tmp/originaux/*.pptx --clobber
      - name: Enregistrer dans la branche documents-import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b documents-import
          git add documents outils/documents/resultat.json
          git commit -q -m "Documents des études en PDF (import depuis le Drive)"
          git push -f origin documents-import
          du -sh documents
