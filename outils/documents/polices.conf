<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Polices de remplacement pour convertir les documents Word et PowerPoint en PDF
     (outils/documents/importer.py). Les polices d'origine ne sont pas libres : on prend
     des équivalents libres, de mêmes dimensions quand il en existe, pour garder la mise en page. -->
<fontconfig>
  <!-- Century Gothic : mêmes chasses qu'Avant Garde Gothic, dont URW Gothic est la reprise libre -->
  <match target="pattern">
    <test qual="any" name="family"><string>Century Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>URW Gothic</string><string>TeX Gyre Adventor</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Monotype Corsiva</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Z003</string><string>TeX Gyre Chorus</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Garamond</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>EB Garamond 12</string><string>EB Garamond</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>AGaramond RegularSC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>EB Garamond 12</string><string>EB Garamond</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Gill Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Gillius ADF</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Gill Sans MT</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Gillius ADF</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Lucida Grande</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Geneva</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial Unicode MS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial Narrow</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans Narrow</string><string>Nimbus Sans Narrow</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Caecilia LT Std Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto Slab</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Caecilia LT Std Bold</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto Slab</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Times New Roman</string><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Verdana</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Georgia</string></test>
    <edit name="family" mode="append" binding="strong"><string>Gelasio</string><string>DejaVu Serif</string></edit>
  </match>
</fontconfig>
